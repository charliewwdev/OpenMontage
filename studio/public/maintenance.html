<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>OpenMontage · 稍候片刻</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <style>
    :root {
      --ink: #f4f1ea;
      --muted: rgba(244, 241, 234, 0.55);
      --line: rgba(244, 241, 234, 0.12);
      --accent: #e8c47c;
      --deep: #0c0e14;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Songti SC", serif;
      color: var(--ink);
      background: var(--deep);
      overflow: hidden;
      display: grid;
      place-items: center;
    }
    .stage {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 20%, rgba(232, 196, 124, 0.14), transparent 55%),
        radial-gradient(ellipse 70% 50% at 85% 75%, rgba(90, 140, 180, 0.12), transparent 50%),
        linear-gradient(165deg, #12151e 0%, #0c0e14 45%, #151018 100%);
    }
    .grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.07;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      animation: grain 0.8s steps(2) infinite;
    }
    @keyframes grain {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(-1%, 1%); }
    }
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(48px);
      opacity: 0.45;
      animation: drift 14s ease-in-out infinite;
    }
    .orb-a {
      width: 280px; height: 280px;
      left: 12%; top: 18%;
      background: rgba(232, 196, 124, 0.35);
    }
    .orb-b {
      width: 320px; height: 320px;
      right: 10%; bottom: 12%;
      background: rgba(70, 120, 160, 0.3);
      animation-delay: -5s;
    }
    @keyframes drift {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(24px, -18px) scale(1.08); }
    }
    .card {
      position: relative;
      z-index: 2;
      width: min(440px, calc(100vw - 2.5rem));
      text-align: center;
      padding: 2.75rem 2rem 2.25rem;
    }
    .mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 64px;
      margin-bottom: 1.25rem;
      border-radius: 18px;
      background: linear-gradient(145deg, rgba(232,196,124,.25), rgba(232,196,124,.05));
      border: 1px solid var(--line);
      box-shadow: 0 0 48px rgba(232, 196, 124, 0.15);
      animation: pulse 2.4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 32px rgba(232, 196, 124, 0.12); transform: scale(1); }
      50% { box-shadow: 0 0 56px rgba(232, 196, 124, 0.28); transform: scale(1.03); }
    }
    .mark svg { width: 34px; height: 34px; }
    .brand {
      font-size: clamp(1.75rem, 4vw, 2.25rem);
      font-weight: 600;
      letter-spacing: 0.04em;
      line-height: 1.15;
    }
    .brand em {
      font-style: normal;
      color: var(--accent);
    }
    .sub {
      margin-top: 0.85rem;
      font-family: ui-sans-serif, system-ui, "PingFang SC", "Helvetica Neue", sans-serif;
      font-size: 0.95rem;
      color: var(--muted);
      line-height: 1.55;
    }
    .reel {
      display: flex;
      justify-content: center;
      gap: 0.45rem;
      margin: 1.75rem 0 0.5rem;
    }
    .frame {
      width: 10px;
      height: 14px;
      border-radius: 2px;
      background: rgba(244, 241, 234, 0.15);
      animation: flicker 1.1s ease-in-out infinite;
    }
    .frame:nth-child(2) { animation-delay: 0.12s; }
    .frame:nth-child(3) { animation-delay: 0.24s; }
    .frame:nth-child(4) { animation-delay: 0.36s; }
    .frame:nth-child(5) { animation-delay: 0.48s; }
    @keyframes flicker {
      0%, 100% { background: rgba(244, 241, 234, 0.12); transform: scaleY(0.85); }
      50% { background: var(--accent); transform: scaleY(1.15); }
    }
    .meta {
      margin-top: 1.5rem;
      font-family: ui-sans-serif, system-ui, "PingFang SC", sans-serif;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(244, 241, 234, 0.35);
    }
    .actions {
      margin-top: 1.75rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem;
      justify-content: center;
    }
    button, a.btn {
      font-family: ui-sans-serif, system-ui, "PingFang SC", sans-serif;
      font-size: 0.85rem;
      border: 1px solid var(--line);
      background: rgba(244, 241, 234, 0.06);
      color: var(--ink);
      padding: 0.65rem 1.15rem;
      border-radius: 999px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s, border-color 0.2s, transform 0.15s;
    }
    button:hover, a.btn:hover {
      background: rgba(232, 196, 124, 0.15);
      border-color: rgba(232, 196, 124, 0.45);
      transform: translateY(-1px);
    }
    .scan {
      position: absolute;
      left: 8%;
      right: 8%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(232,196,124,.55), transparent);
      animation: scan 4.5s linear infinite;
      pointer-events: none;
    }
    @keyframes scan {
      0% { top: 12%; opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { top: 88%; opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="stage" aria-hidden="true">
    <div class="orb orb-a"></div>
    <div class="orb orb-b"></div>
    <div class="scan"></div>
  </div>
  <div class="grain" aria-hidden="true"></div>
  <main class="card">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="6" y="10" width="36" height="28" rx="4" stroke="#e8c47c" stroke-width="2"/>
        <path d="M6 18h36M16 10v8M32 10v8" stroke="#e8c47c" stroke-width="2"/>
        <path d="M20 26l10 6-10 6V26z" fill="#e8c47c"/>
      </svg>
    </div>
    <h1 class="brand">Open<em>Montage</em></h1>
    <p class="sub">工坊正在换幕检修，片刻后继续创作。<br />影片还在，密钥还在，稍等镜头归位。</p>
    <div class="reel" aria-hidden="true">
      <span class="frame"></span>
      <span class="frame"></span>
      <span class="frame"></span>
      <span class="frame"></span>
      <span class="frame"></span>
    </div>
    <div class="actions">
      <button type="button" id="retry">重新连接</button>
      <a class="btn" href="/">回到首页</a>
    </div>
    <p class="meta" id="status">checking · openmontage</p>
  </main>
  <script>
    const statusEl = document.getElementById("status");
    async function probe() {
      try {
        const r = await fetch("/api/health", { cache: "no-store" });
        if (r.ok) {
          statusEl.textContent = "online · redirecting";
          location.replace("/");
          return;
        }
        statusEl.textContent = "standby · " + r.status;
      } catch (e) {
        statusEl.textContent = "standby · reconnecting";
      }
    }
    document.getElementById("retry").addEventListener("click", probe);
    probe();
    setInterval(probe, 8000);
  </script>
</body>
</html>
