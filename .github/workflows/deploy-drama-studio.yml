name: Deploy Drama Studio (git.dtok.io → Coolify)

# Preferred path (dtok-app style):
#   GitHub main → slim sync → git.dtok.io/deploy → GitLab webhook → Coolify
# Fallback when DTOK sync secrets are missing: direct Coolify API deploy.
#
# Note: do NOT gate jobs with `if: secrets.X != ''` — empty secret comparisons
# skip every job and GitHub marks the run as a workflow-file failure (0s).

on:
  push:
    branches: [main]
    paths:
      - "studio/**"
      - "docker-compose.studio.yml"
      - "scripts/deploy_coolify_drama_studio.sh"
      - "scripts/sync_dtok_git.sh"
      - "lib/**"
      - "tools/pipeline/**"
      - "pipeline_defs/short-drama.yaml"
      - "workflow_defs/**"
      - ".github/workflows/deploy-drama-studio.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync slim tree to git.dtok.io (deploy)
        id: sync
        env:
          DTOK_GIT_TOKEN: ${{ secrets.DTOK_GIT_TOKEN }}
          DTOK_GIT_PASSWORD: ${{ secrets.DTOK_GIT_PASSWORD }}
          DTOK_GIT_USERNAME: ${{ secrets.DTOK_GIT_USERNAME }}
          COOLIFY_GITLAB_WEBHOOK_SECRET: ${{ secrets.COOLIFY_GITLAB_WEBHOOK_SECRET }}
          DTOK_SYNC_BRANCH: deploy
          GITHUB_MIRROR_SKIP: "1"
        run: |
          set -euo pipefail
          USERNAME="${DTOK_GIT_USERNAME:-oauth2}"
          PASSWORD="${DTOK_GIT_TOKEN:-${DTOK_GIT_PASSWORD:-}}"
          if [[ -z "$PASSWORD" ]]; then
            echo "skip_sync=1" >> "$GITHUB_OUTPUT"
            echo "No DTOK_GIT_TOKEN / DTOK_GIT_PASSWORD — will try Coolify API fallback."
            exit 0
          fi
          git config --global credential.helper store
          printf 'https://%s:%s@git.dtok.io\n' "$USERNAME" "$PASSWORD" > ~/.git-credentials
          chmod 600 ~/.git-credentials
          ./scripts/sync_dtok_git.sh
          echo "skip_sync=0" >> "$GITHUB_OUTPUT"

      - name: Coolify API fallback
        if: steps.sync.outputs.skip_sync == '1'
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_URL: ${{ secrets.COOLIFY_URL || 'https://cicd.dtok.io' }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_DRAMA_STUDIO_UUID }}
        run: |
          set -euo pipefail
          if [[ -z "${COOLIFY_TOKEN:-}" || -z "${COOLIFY_APP_UUID:-}" ]]; then
            echo "::error::Missing deploy secrets. Set DTOK_GIT_TOKEN (preferred) or COOLIFY_TOKEN + COOLIFY_DRAMA_STUDIO_UUID."
            exit 1
          fi
          UA="Mozilla/5.0 OpenMontage-github-actions"
          RESP=$(curl -fsS -X POST \
            "${COOLIFY_URL}/api/v1/deploy?uuid=${COOLIFY_APP_UUID}&force=false" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            -H "User-Agent: ${UA}" \
            -H "Accept: application/json")
          echo "$RESP"
          DEP_UUID=$(python3 -c "import json,sys; print(json.loads(sys.argv[1])['deployments'][0]['deployment_uuid'])" "$RESP")
          for i in $(seq 1 80); do
            STATUS=$(curl -fsS \
              "${COOLIFY_URL}/api/v1/deployments/${DEP_UUID}" \
              -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
              -H "User-Agent: ${UA}" \
              -H "Accept: application/json" \
              | python3 -c "import json,sys; print(json.load(sys.stdin).get('status',''))")
            echo "[$i] $STATUS"
            case "$STATUS" in
              finished) echo "Deployed"; exit 0 ;;
              failed|error-ing|cancelled) echo "Failed: $STATUS"; exit 1 ;;
            esac
            sleep 15
          done
          echo "Timeout"; exit 1
