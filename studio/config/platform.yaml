helpSections:
  - title: 快速开始
    body: 1. 登录账号。2. 打开「模型配置」，填入文本大模型与火山 ARK Key（BYOK，密钥仅你可见）。3. 在「影视工坊」新建项目后走七步生产线；需要自动化时再用创作 Agent 一键跑通后局部重跑。
  - title: 七步工坊
    body: 剧本（文本大模型）→ 角色/场景/道具（Seedream）→ 分镜（Seedance）→ 配音 → 剪辑（FFmpeg）。也可用创作 Agent「一键全流程」后台自动跑通；每一步仍可单独重跑或换版本。
  - title: 模型配置与能力
    body: 支持智川云 Token（tokens.gpuhome.cc）、算桥/算家云（api.suanjiayun.com）、DeepSeek、OpenAI、Claude、Gemini、通义、Kimi、豆包、智谱、Grok、MiniMax、OpenRouter、Cursor Auto 等。出图/出片可用火山方舟，或在智川云租 GPU 后填写 ComfyUI 地址。密钥按账号隔离保存，热加载无需重启。
  - title: 资产与画布
    body: 资产库汇总角色/场景/道具图片与个人上传；提示词库可新建复用；无限画布展示当前项目节点进度；作品频道回看成片导出。
  - title: 爆款内容广场
    body: 顶部「真实短视频场景」展示抖音/TikTok/小红书等平台爆款的节拍结构（如 AI 氛围感写真卡点、短剧钩子），可一键带入创作；平台套路与工作流提示词可复制；下方画面墙仅作气质参考（多为静帧），不是热榜成片抓取。

splitStages:
  - startsAt: 0
    title: 正在核对剧本与创作素材
    detail: 识别本集角色、空镜场景、道具与视觉风格。
  - startsAt: 25
    title: 正在拆分剧情节拍与时长
    detail: 按场景、对白、动作和情绪转折规划连续视频片段。
  - startsAt: 70
    title: 正在规划镜头衔接与素材引用
    detail: 匹配每个镜头出场的角色形象、场景和道具参考图。
  - startsAt: 130
    title: 正在编写 Seedance 视频提示词
    detail: 组织景别、运镜、动作、对白、声音和画面风格。
  - startsAt: 220
    title: 正在检查完整性并组装结果
    detail: 核对剧情覆盖、片段时长、素材引用和输出结构。

