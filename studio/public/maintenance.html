<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>OpenMontage · 系统维护中</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <style>
    :root {
      --ink: #e8f0ff;
      --muted: rgba(200, 220, 255, 0.55);
      --line: rgba(120, 180, 255, 0.18);
      --cyan: #5ce1ff;
      --violet: #8b7cff;
      --deep: #05070d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: ui-sans-serif, system-ui, "PingFang SC", "Helvetica Neue", sans-serif;
      color: var(--ink);
      background: var(--deep);
      overflow: hidden;
      display: grid;
      place-items: center;
    }
    .stage {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 90% 70% at 50% -10%, rgba(92, 225, 255, 0.12), transparent 55%),
        radial-gradient(ellipse 60% 50% at 100% 100%, rgba(139, 124, 255, 0.14), transparent 50%),
        linear-gradient(180deg, #0a0e18 0%, #05070d 100%);
    }
    .grid {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(92, 225, 255, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(92, 225, 255, 0.04) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse 70% 60% at 50% 45%, #000 20%, transparent 75%);
      animation: gridPulse 6s ease-in-out infinite;
    }
    @keyframes gridPulse {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 0.9; }
    }
    .beam {
      position: absolute;
      left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--cyan), var(--violet), transparent);
      box-shadow: 0 0 24px rgba(92, 225, 255, 0.45);
      animation: beam 3.2s linear infinite;
      opacity: 0.7;
    }
    @keyframes beam {
      0% { top: 8%; opacity: 0; }
      12% { opacity: 0.85; }
      88% { opacity: 0.85; }
      100% { top: 92%; opacity: 0; }
    }
    .card {
      position: relative;
      z-index: 2;
      width: min(460px, calc(100vw - 2rem));
      text-align: center;
      padding: 2.5rem 1.75rem 2rem;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: rgba(8, 12, 22, 0.72);
      backdrop-filter: blur(16px);
      box-shadow: 0 0 0 1px rgba(92, 225, 255, 0.06), 0 24px 80px rgba(0, 0, 0, 0.45);
    }
    .hud {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      margin-bottom: 1.25rem;
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
      border: 1px solid rgba(92, 225, 255, 0.28);
      background: rgba(92, 225, 255, 0.08);
      font-size: 0.7rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--cyan);
    }
    .hud i {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 10px var(--cyan);
      animation: blink 1.2s ease-in-out infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }
    .brand {
      font-size: clamp(1.65rem, 4vw, 2.1rem);
      font-weight: 650;
      letter-spacing: 0.02em;
      line-height: 1.2;
    }
    .brand span { color: var(--cyan); }
    .sub {
      margin-top: 0.9rem;
      font-size: 0.95rem;
      color: var(--muted);
      line-height: 1.65;
    }
    .bars {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 4px;
      height: 28px;
      margin: 1.6rem 0 0.35rem;
    }
    .bars b {
      display: block;
      width: 4px;
      border-radius: 2px;
      background: linear-gradient(180deg, var(--cyan), var(--violet));
      animation: eq 1s ease-in-out infinite;
    }
    .bars b:nth-child(1) { height: 40%; animation-delay: 0s; }
    .bars b:nth-child(2) { height: 70%; animation-delay: 0.1s; }
    .bars b:nth-child(3) { height: 100%; animation-delay: 0.2s; }
    .bars b:nth-child(4) { height: 55%; animation-delay: 0.3s; }
    .bars b:nth-child(5) { height: 85%; animation-delay: 0.4s; }
    .bars b:nth-child(6) { height: 45%; animation-delay: 0.5s; }
    .bars b:nth-child(7) { height: 65%; animation-delay: 0.6s; }
    @keyframes eq {
      0%, 100% { transform: scaleY(0.55); opacity: 0.55; }
      50% { transform: scaleY(1); opacity: 1; }
    }
    .actions {
      margin-top: 1.5rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      justify-content: center;
    }
    button, a.btn {
      font: inherit;
      font-size: 0.85rem;
      border: 1px solid var(--line);
      background: rgba(92, 225, 255, 0.08);
      color: var(--ink);
      padding: 0.65rem 1.2rem;
      border-radius: 999px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s, border-color 0.2s, transform 0.15s, box-shadow 0.2s;
    }
    button:hover, a.btn:hover {
      border-color: rgba(92, 225, 255, 0.5);
      background: rgba(92, 225, 255, 0.16);
      box-shadow: 0 0 24px rgba(92, 225, 255, 0.18);
      transform: translateY(-1px);
    }
    .meta {
      margin-top: 1.35rem;
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(200, 220, 255, 0.32);
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>
  <div class="stage" aria-hidden="true">
    <div class="grid"></div>
    <div class="beam"></div>
  </div>
  <main class="card">
    <div class="hud"><i></i> System maintenance</div>
    <h1 class="brand">Open<span>Montage</span></h1>
    <p class="sub">
      渲染集群热切换中，创作台暂时离线。<br />
      项目、密钥与成片均已保留，节点就绪后自动恢复。
    </p>
    <div class="bars" aria-hidden="true">
      <b></b><b></b><b></b><b></b><b></b><b></b><b></b>
    </div>
    <div class="actions">
      <button type="button" id="retry">重新探测节点</button>
      <a class="btn" href="/">返回首页</a>
    </div>
    <p class="meta" id="status">link · standby</p>
  </main>
  <script>
    const statusEl = document.getElementById("status");
    async function probe() {
      try {
        const r = await fetch("/api/health", { cache: "no-store" });
        if (r.ok) {
          statusEl.textContent = "link · online · redirect";
          location.replace("/");
          return;
        }
        statusEl.textContent = "link · warm-up · " + r.status;
      } catch (e) {
        statusEl.textContent = "link · reconnecting";
      }
    }
    document.getElementById("retry").addEventListener("click", probe);
    probe();
    setInterval(probe, 6000);
  </script>
</body>
</html>
