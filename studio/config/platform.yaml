helpSections:
  - title: 快速开始
    body: 1. 在「密钥配置」写入 DeepSeek 与火山 ARK Key。2. 新建项目或用创作 Agent。3. 按六步完成剧本到成片。
  - title: 六步工坊
    body: 剧本（DeepSeek）→ 角色/场景/道具（Seedream）→ 分镜（Seedance）→ 剪辑（FFmpeg）。每一步都可以单独重跑或换版本。
  - title: 密钥与能力
    body: 未配置 Key 时，相关按钮会引导你一键进入密钥页。密钥保存在服务器 PROJECTS_ROOT/.studio_secrets.json，热加载无需重启。
  - title: 资产与画布
    body: 资产库汇总角色/场景/道具图片；无限画布展示当前项目节点进度；TV 页回看成片导出。

splitStages:
  - startsAt: 0
    title: 正在核对剧本与创作素材
    detail: 识别本集角色、空镜场景、道具与视觉风格。
  - startsAt: 25
    title: 正在拆分剧情节拍与时长
    detail: 按场景、对白、动作和情绪转折规划连续视频片段。
  - startsAt: 70
    title: 正在规划镜头衔接与素材引用
    detail: 匹配每个镜头出场的角色形象、场景和道具参考图。
  - startsAt: 130
    title: 正在编写 Seedance 视频提示词
    detail: 组织景别、运镜、动作、对白、声音和画面风格。
  - startsAt: 220
    title: 正在检查完整性并组装结果
    detail: 核对剧情覆盖、片段时长、素材引用和输出结构。

