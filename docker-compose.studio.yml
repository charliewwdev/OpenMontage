# Coolify + local Drama Studio stack (db / redis / studio only).
# Coolify ignores Compose profiles and pulls every image listed here — keep
# optional MinIO / edge-worker out of this file:
#   Local + MinIO:  docker compose -f docker-compose.studio.yml -f docker-compose.studio.minio.yml up --build
#   Edge worker:    docker compose -f docker-compose.studio.yml -f docker-compose.studio.edge.yml up media-worker-edge
# Hosted: set MINIO_* to external MinIO (e.g. minio-api.dtok.io). Then open the FQDN and click Demo.

services:
  drama-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-omstudio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-omstudio_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-omstudio}
    volumes:
      - drama_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  drama-redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Persist queue so pending / in-flight media jobs survive container restart.
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--appendfsync",
        "everysec",
        "--dir",
        "/data",
        "--save",
        "60",
        "1",
      ]
    volumes:
      - drama_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 6

  drama-studio:
    build:
      context: .
      dockerfile: studio/Dockerfile
    image: openmontage-drama-studio:local
    restart: unless-stopped
    depends_on:
      drama-db:
        condition: service_healthy
      drama-redis:
        condition: service_healthy
    ports:
      - "${PORT:-8787}:8787"
    environment:
      HOST: "0.0.0.0"
      PORT: "8787"
      OPENMONTAGE_ROOT: /app
      PROJECTS_ROOT: /data/projects
      # Default: same-compose Postgres. Override with Coolify/aaPanel URL if needed.
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-omstudio}:${POSTGRES_PASSWORD:-omstudio_change_me}@drama-db:5432/${POSTGRES_DB:-omstudio}?sslmode=disable}
      STUDIO_DATABASE_URL: ${STUDIO_DATABASE_URL:-}
      # Shared media queue (entity stills + video). Entrypoint starts media_worker when set.
      REDIS_URL: ${REDIS_URL:-redis://drama-redis:6379/0}
      STUDIO_REDIS_URL: ${STUDIO_REDIS_URL:-${REDIS_URL:-redis://drama-redis:6379/0}}
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
      # Parallel Redis media jobs (stills + video). Keep ≤4 — remote Comfy/H3 saturates.
      STUDIO_MEDIA_WORKERS: ${STUDIO_MEDIA_WORKERS:-3}
      STUDIO_VIDEO_PARALLEL: ${STUDIO_VIDEO_PARALLEL:-3}
      # NVIDIA / Seedream stills. Does not add ComfyUI GPU jobs.
      STUDIO_IMAGE_WORKERS: ${STUDIO_IMAGE_WORKERS:-2}
      STUDIO_DIST: /app/studio/dist
      STUDIO_PUBLIC_URL: ${STUDIO_PUBLIC_URL:-http://localhost:8787}
      STUDIO_CORS_ORIGINS: ${STUDIO_CORS_ORIGINS:-${STUDIO_PUBLIC_URL:-http://localhost:8787}}
      # Empty = local Demo-only auth (no external account API). Set for hosted password/Google.
      API_BASE_URL: ${API_BASE_URL:-}
      STUDIO_AUTH_REQUIRED: ${STUDIO_AUTH_REQUIRED:-true}
      STUDIO_DEMO_ENABLED: ${STUDIO_DEMO_ENABLED:-true}
      STUDIO_DEMO_AUTO_ENTER: ${STUDIO_DEMO_AUTO_ENTER:-false}
      STUDIO_DEMO_SECRET: ${STUDIO_DEMO_SECRET:-}
      STUDIO_OPS_TOKEN: ${STUDIO_OPS_TOKEN:-}
      STUDIO_GOOGLE_ENABLED: ${STUDIO_GOOGLE_ENABLED:-false}
      # Optional generation keys (same names as repo .env.example / dtok-style secrets)
      FAL_KEY: ${FAL_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      PEXELS_API_KEY: ${PEXELS_API_KEY:-}
      PIXABAY_API_KEY: ${PIXABAY_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      # Free-first defaults (override only when pinning a paid/rented backend)
      STUDIO_IMAGE_BACKEND: ${STUDIO_IMAGE_BACKEND:-auto}
      STUDIO_VIDEO_BACKEND: ${STUDIO_VIDEO_BACKEND:-auto}
      STUDIO_FREE_FIRST: ${STUDIO_FREE_FIRST:-1}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      CURSOR_API_KEY: ${CURSOR_API_KEY:-}
      CURSOR_API_BASE: ${CURSOR_API_BASE:-https://api.cursor.com}
      CURSOR_MODEL: ${CURSOR_MODEL:-auto}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      VOLCENGINE_API_KEY: ${VOLCENGINE_API_KEY:-}
      ARK_API_KEY: ${ARK_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_NIM_API_KEY: ${NVIDIA_NIM_API_KEY:-}
      HF_TOKEN: ${HF_TOKEN:-}
      HF_IMAGE_MODEL: ${HF_IMAGE_MODEL:-black-forest-labs/FLUX.1-schnell}
      CF_ACCOUNT_ID: ${CF_ACCOUNT_ID:-}
      CF_API_TOKEN: ${CF_API_TOKEN:-}
      CF_IMAGE_MODEL: ${CF_IMAGE_MODEL:-@cf/black-forest-labs/flux-1-schnell}
      COMFYUI_SERVER_URL: ${COMFYUI_SERVER_URL:-}
      COMFYUI_VIDEO_SERVER_URL: ${COMFYUI_VIDEO_SERVER_URL:-}
      COMFY_API_KEY: ${COMFY_API_KEY:-}
      OSS_API_BASE_URL: ${OSS_API_BASE_URL:-}
      OSS_CONSOLE_USERNAME: ${OSS_CONSOLE_USERNAME:-}
      OSS_CONSOLE_PASSWORD: ${OSS_CONSOLE_PASSWORD:-}
      # Hosted Coolify sets MINIO_* to external MinIO. Local+minio overlay uses drama-minio.
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://drama-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-${MINIO_ROOT_USER:-minioadmin}}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-${MINIO_ROOT_PASSWORD:-minioadmin}}
      MINIO_BUCKET: ${MINIO_BUCKET:-openmontage}
      MINIO_PREFIX: ${MINIO_PREFIX:-openmontage}
      MINIO_PUBLIC_BASE: ${MINIO_PUBLIC_BASE:-http://127.0.0.1:9000}
    volumes:
      - drama_projects:/data/projects
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8787/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  drama_projects:
  drama_pg:
  drama_redis:
