inspirePrompts:
  - tag: 都市爽剧
    text: 落魄女婿被丈母娘羞辱三年后，以隐秘身份归来，用商业与人情双重反击。
  - tag: 悬疑
    text: 女法医发现每具尸体都带着同一串古语，而破译者正是失踪多年的自己。
  - tag: 甜宠
    text: 冷面总裁误把替身当成真正的青梅竹马，直到替身要离开，他才发现心动早已失控。
  - tag: 穿越
    text: 游戏策划死后穿越进自己设计的副本，必须用策划知识通关，才能回到现实。
  - tag: 职场
    text: 新人设计师被抢创意后反杀：她用一场直播让品牌方看到真正的创作者。
  - tag: 科幻
    text: 记忆可交易的城市里，男主卖掉童年换工作机会，却发现买家正是未来的自己。
  - tag: 古风
    text: 女刺客伪装成哑巴丫鬟潜入侯府，却发现侯爷早就识破，并故意留下她。
  - tag: 校园
    text: 学渣为了追女神报名辩论社，结果被拉进一场关乎学校存亡的全国赛。

challenges:
  - id: hook-15
    title: 15 秒钩子挑战
    prize: 创作积分 +50
    brief: 用一集剧本写出前 15 秒必须抓住观众的冲突钩子，并生成至少 3 个分镜镜头。
  - id: character-loop
    title: 角色一致性挑战
    prize: 创作积分 +80
    brief: 同一角色出 4 张不同情绪造型，保持脸型与服装主色一致。
  - id: vertical-ep
    title: 竖屏单集挑战
    prize: 创作积分 +120
    brief: 完成 9:16 单集：剧本 → 角色 → 场景 → 分镜 → 剪辑导出。

