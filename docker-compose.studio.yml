# Local / Coolify-compatible Drama Studio stack
# Usage:
#   docker compose -f docker-compose.studio.yml up --build
# Coolify: docker-compose build pack → this file (or Dockerfile-only + DATABASE_URL)

services:
  drama-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-omstudio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-omstudio_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-omstudio}
    volumes:
      - drama_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  drama-redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Persist queue so pending / in-flight media jobs survive container restart.
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--appendfsync",
        "everysec",
        "--dir",
        "/data",
        "--save",
        "60",
        "1",
      ]
    volumes:
      - drama_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 6

  drama-studio:
    build:
      context: .
      dockerfile: studio/Dockerfile
    image: openmontage-drama-studio:local
    restart: unless-stopped
    depends_on:
      drama-db:
        condition: service_healthy
      drama-redis:
        condition: service_healthy
    ports:
      - "${PORT:-8787}:8787"
    environment:
      HOST: "0.0.0.0"
      PORT: "8787"
      OPENMONTAGE_ROOT: /app
      PROJECTS_ROOT: /data/projects
      # Default: same-compose Postgres. Override with Coolify/aaPanel URL if needed.
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-omstudio}:${POSTGRES_PASSWORD:-omstudio_change_me}@drama-db:5432/${POSTGRES_DB:-omstudio}?sslmode=disable}
      STUDIO_DATABASE_URL: ${STUDIO_DATABASE_URL:-}
      # Shared media queue (entity stills + video). Entrypoint starts media_worker when set.
      REDIS_URL: ${REDIS_URL:-redis://drama-redis:6379/0}
      STUDIO_REDIS_URL: ${STUDIO_REDIS_URL:-${REDIS_URL:-redis://drama-redis:6379/0}}
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
      # Parallel Redis media jobs (stills + video). Keep ≤4 — remote Comfy/H3 saturates.
      STUDIO_MEDIA_WORKERS: ${STUDIO_MEDIA_WORKERS:-3}
      STUDIO_VIDEO_PARALLEL: ${STUDIO_VIDEO_PARALLEL:-3}
      # NVIDIA / Seedream stills. Does not add ComfyUI GPU jobs.
      STUDIO_IMAGE_WORKERS: ${STUDIO_IMAGE_WORKERS:-2}
      STUDIO_DIST: /app/studio/dist
      STUDIO_PUBLIC_URL: ${STUDIO_PUBLIC_URL:-http://localhost:8787}
      STUDIO_CORS_ORIGINS: ${STUDIO_CORS_ORIGINS:-${STUDIO_PUBLIC_URL:-http://localhost:8787}}
      API_BASE_URL: ${API_BASE_URL:-https://api-app.dtok.io/api/v1}
      STUDIO_AUTH_REQUIRED: ${STUDIO_AUTH_REQUIRED:-true}
      STUDIO_DEMO_ENABLED: ${STUDIO_DEMO_ENABLED:-true}
      STUDIO_DEMO_AUTO_ENTER: ${STUDIO_DEMO_AUTO_ENTER:-false}
      STUDIO_DEMO_SECRET: ${STUDIO_DEMO_SECRET:-}
      STUDIO_OPS_TOKEN: ${STUDIO_OPS_TOKEN:-}
      # Optional generation keys (same names as repo .env.example / dtok-style secrets)
      FAL_KEY: ${FAL_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      PEXELS_API_KEY: ${PEXELS_API_KEY:-}
      PIXABAY_API_KEY: ${PIXABAY_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      CURSOR_API_KEY: ${CURSOR_API_KEY:-}
      CURSOR_API_BASE: ${CURSOR_API_BASE:-https://api.cursor.com}
      CURSOR_MODEL: ${CURSOR_MODEL:-auto}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      VOLCENGINE_API_KEY: ${VOLCENGINE_API_KEY:-}
      ARK_API_KEY: ${ARK_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      OSS_API_BASE_URL: ${OSS_API_BASE_URL:-}
      OSS_CONSOLE_USERNAME: ${OSS_CONSOLE_USERNAME:-}
      OSS_CONSOLE_PASSWORD: ${OSS_CONSOLE_PASSWORD:-}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-}
      MINIO_BUCKET: ${MINIO_BUCKET:-dtok-app}
      MINIO_PREFIX: ${MINIO_PREFIX:-openmontage}
    volumes:
      - drama_projects:/data/projects
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8787/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  drama_projects:
  drama_pg:
  drama_redis:
