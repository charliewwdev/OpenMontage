# OpenMontage Drama Studio — product / platform config (single source of truth).
# Override secrets and runtime paths via env (.env / Coolify); edit lists here.
# See .cursor/rules/studio-no-hardcode.mdc

product:
  name: OpenMontage Drama Studio
  brand: OpenMontage
  tagline: 自带密钥 · 一站式短剧工坊
  publicUrlEnv: STUDIO_PUBLIC_URL

auth:
  # Browse-first: left nav + public GETs need no login.
  # Auth is required only for model/generation calls and other mutations.
  required: true
  gateApp: false
  defaultNav: workshop
  client: WEB
  methods:
    - password
    - google
  # Soft launch: Demo is opt-in only (no auto-enter).
  # Override Google web client via STUDIO_GOOGLE_CLIENT_ID if needed.
  google:
    enabled: true
    # Google Cloud OAuth client "OpenMontage Studio" (dtok-438fb) — GIS one-tap / button
    clientId: 165025931859-umal625a9njtveircsijfcr6d1v5s2dk.apps.googleusercontent.com
  # Optional Demo (shared seed data). Disabled auto-enter for product launch.
  demo:
    enabled: true
    userId: demo
    username: demo
    password: demo
    displayName: Demo 体验账号
    ttlDays: 7
    seedProjectId: welcome-ep01
    autoEnter: false
    prefill: false

i18n:
  defaultLocale: zh
  locales:
    - zh
    - en

pinterest:
  # Live pidget users (public pins). Seed catalog fills the wall when TLS is blocked.
  users:
    - pinterest
    - netflix
    - voguemagazine
    - disney
    - hbomax
    - interviewmag
    - filmgrab
    - criterion
    - letterboxd
    - shortoftheweek
    - cinematography
    - artofthetitle
  boards:
    - user: filmgrab
      board: movies
      label: Film Grab
    - user: pinterest
      board: photography
      label: Photography
  categories:
    - id: all
      label: 全部
    - id: character
      label: 角色
    - id: scene
      label: 场景
    - id: prop
      label: 道具
    - id: style
      label: 风格
    - id: storyboard
      label: 分镜
  # Dense offline wall: studio/config/pinterest_seed.json (real i.pinimg.com URLs)

defaults:
  genre: 都市情感
  ratio: "9:16"
  episodeCount: 3
  deepseekBaseUrl: https://api.deepseek.com
  deepseekModel: deepseek-chat
  seedreamModel: doubao-seedream-5-0-pro-260628
  seedanceModel: doubao-seedance-2-0-fast-260128
  visualStyle: 当代都市夜戏，电影感冷暖对比
  seedanceApiUrl: https://ark.cn-beijing.volces.com/api/v3/contents/generations/tasks
  # Prompt-fit QA loop (entity stills + segment video frames)
  qaMinScore: 0.7
  entityQaMaxAttempts: 5
  videoQaMaxAttempts: 5
  # Bounded media thread pool (entity stills + video + QA) when Redis is unset.
  # With REDIS_URL, jobs go to Redis and media_worker processes them.
  # Override with env STUDIO_MEDIA_WORKERS / STUDIO_VIDEO_PARALLEL. Keep ≤4.
  mediaJobWorkers: 3
  # Multi-process uvicorn (entrypoint UVICORN_WORKERS). Store uses fcntl locks.
  uvicornWorkers: 2
  maxCharacters: 24
  maxScenes: 24
  maxProps: 24

genres:
  - 都市情感
  - 豪门霸总
  - 婚姻家庭
