helpSections:
  - title: 快速开始
    body: 1. 登录账号。2. 打开「模型配置」，填入文本大模型与火山 ARK Key（BYOK，密钥仅你可见）。3. 用创作 Agent「一键全流程成片」，或新建项目后逐步走六步工坊。
  - title: 六步工坊
    body: 剧本（文本大模型）→ 角色/场景/道具（Seedream）→ 分镜（Seedance）→ 配音 → 剪辑（FFmpeg）。也可用「一键全流程」后台自动跑通；每一步仍可单独重跑或换版本。
  - title: 模型配置与能力
    body: 支持智川云 Token（tokens.gpuhome.cc）、DeepSeek、OpenAI、Claude、Gemini、通义、Kimi、豆包、智谱、Grok、MiniMax、OpenRouter、Cursor Auto 等。出图/出片可用火山方舟，或在智川云租 GPU 后填写 ComfyUI 地址。密钥按账号隔离保存，热加载无需重启。
  - title: 资产与画布
    body: 资产库汇总角色/场景/道具图片与个人上传；提示词库可新建复用；无限画布展示当前项目节点进度；作品频道回看成片导出。

splitStages:
  - startsAt: 0
    title: 正在核对剧本与创作素材
    detail: 识别本集角色、空镜场景、道具与视觉风格。
  - startsAt: 25
    title: 正在拆分剧情节拍与时长
    detail: 按场景、对白、动作和情绪转折规划连续视频片段。
  - startsAt: 70
    title: 正在规划镜头衔接与素材引用
    detail: 匹配每个镜头出场的角色形象、场景和道具参考图。
  - startsAt: 130
    title: 正在编写 Seedance 视频提示词
    detail: 组织景别、运镜、动作、对白、声音和画面风格。
  - startsAt: 220
    title: 正在检查完整性并组装结果
    detail: 核对剧情覆盖、片段时长、素材引用和输出结构。

