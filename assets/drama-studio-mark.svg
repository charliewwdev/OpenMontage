<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" role="img" aria-label="Drama Studio">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#1A1028"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#FB7185"/>
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="36" fill="url(#bg)"/>
  <!-- stage frame -->
  <rect x="38" y="42" width="124" height="88" rx="10" fill="url(#screen)" stroke="#475569" stroke-width="2"/>
  <!-- play / shot mark -->
  <path d="M86 68 L86 104 L118 86 Z" fill="url(#accent)"/>
  <!-- timeline -->
  <rect x="38" y="146" width="124" height="10" rx="5" fill="#1E293B"/>
  <rect x="38" y="146" width="72" height="10" rx="5" fill="url(#accent)"/>
  <circle cx="110" cy="151" r="7" fill="#FEF2F2" stroke="#F43F5E" stroke-width="3"/>
  <!-- sprocket dots -->
  <circle cx="28" cy="58" r="3" fill="#64748B"/>
  <circle cx="28" cy="78" r="3" fill="#64748B"/>
  <circle cx="28" cy="98" r="3" fill="#64748B"/>
  <circle cx="172" cy="58" r="3" fill="#64748B"/>
  <circle cx="172" cy="78" r="3" fill="#64748B"/>
  <circle cx="172" cy="98" r="3" fill="#64748B"/>
</svg>
