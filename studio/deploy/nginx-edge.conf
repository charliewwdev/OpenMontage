# Edge proxy in front of drama-studio.
# Serves branded /maintenance.html on 502/503/504 instead of default nginx page.

upstream drama_studio_upstream {
    server drama-studio:8787;
    keepalive 8;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 64m;

    # Public standby page (also used by error_page)
    location = /maintenance.html {
        root /usr/share/nginx/html;
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "no-store" always;
    }

    # WebSocket: task queue live progress (/api/settings/jobs/ws)
    location /api/settings/jobs/ws {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 5s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_buffering off;
        proxy_pass http://drama_studio_upstream;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_pass http://drama_studio_upstream;

        proxy_intercept_errors on;
        # =200 keeps outer TLS proxies from swapping in a white "502 Bad Gateway" page.
        error_page 502 503 504 =200 @maintenance;
    }

    location @maintenance {
        root /usr/share/nginx/html;
        rewrite ^ /maintenance.html break;
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "no-store" always;
    }
}
